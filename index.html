<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Ancient Ruins Runner</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #111; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #ui {
            position: absolute; top: 20px; left: 20px; color: #fff; text-shadow: 0 0 10px rgba(0,0,0,0.8);
            z-index: 10; pointer-events: none;
        }
        #score { font-size: 24px; font-weight: bold; }
        #gameOver { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            background: rgba(0,0,0,0.8); padding: 40px; border-radius: 15px; text-align: center; color: #fff; 
            border: 2px solid #ffd700; pointer-events: auto; }
        #restartBtn { margin-top: 20px; padding: 10px 20px; font-size: 18px; cursor: pointer; background: #ffd700; 
            color: #000; border: none; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>
<div id="ui">
    <div id="score">Дистанция: 0</div>
</div>
<div id="gameOver">
    <div style="font-size: 32px; margin-bottom: 15px;">☠ Древние Руины</div>
    <div id="finalScore" style="font-size: 20px; margin-bottom: 10px;"></div>
    <button id="restartBtn">Начать заново</button>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.164/build/three.module.js';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.164/examples/jsm/controls/OrbitControls.js';
import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.164/examples/jsm/loaders/GLTFLoader.js';
import { DRACOLoader } from 'https://cdn.jsdelivr.net/npm/three@0.164/examples/jsm/loaders/DRACOLoader.js';

// --- STATE ---
const state = {
    speed: 0.25,
    score: 0,
    lane: 1,
    targetLane: 1,
    laneOffset: 5,
    playerBaseY: 0,
    jumpVelocity: 0,
    isJumping: false,
    gravity: 0.015,
    gameOver: false,
    lastSpawnZ: 0,
    spawnRate: 25,
    lastCoinSpawn: 0,
    coinRate: 15
};

// --- SCENE ---
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x2d4a22, 0.025);

// --- CAMERA ---
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 5, 12);
camera.lookAt(0, 2, 0);

// --- RENDERER ---
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.appendChild(renderer.domElement);

// --- LIGHTS ---
const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6);
hemiLight.position.set(0, 20, 0);
scene.add(hemiLight);

const ambient = new THREE.AmbientLight(0x404040, 0.5);
scene.add(ambient);

const dirLight = new THREE.DirectionalLight(0xffd996, 1.2);
dirLight.position.set(10, 20, 5);
dirLight.castShadow = true;
dirLight.shadow.mapSize.width = 2048;
dirLight.shadow.mapSize.height = 2048;
dirLight.shadow.camera.near = 0.5;
dirLight.shadow.camera.far = 100;
dirLight.shadow.camera.left = -20;
dirLight.shadow.camera.right = 20;
dirLight.shadow.camera.top = 20;
dirLight.shadow.camera.bottom = -20;
scene.add(dirLight);

// --- LOADERS ---
const dracoLoader = new DRACOLoader();
dracoLoader.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.164/examples/jsm/libs/draco/');
const gltfLoader = new GLTFLoader();
gltfLoader.setDRACOLoader(dracoLoader);

// --- MATERIALS ---
const trackMaterial = new THREE.MeshStandardMaterial({ 
    color: 0x8b7d6b, 
    roughness: 0.9, 
    metalness: 0.1 
});
const mossMaterial = new THREE.MeshStandardMaterial({ 
    color: 0x228b22, 
    emissive: 0x228b22, 
    emissiveIntensity: 0.15, 
    roughness: 0.8 
});
const goldMaterial = new THREE.MeshStandardMaterial({ 
    color: 0xffd700, 
    metalness: 1.0, 
    roughness: 0.2, 
    emissive: 0xffd700, 
    emissiveIntensity: 0.3 
});
const runeMaterialOrange = new THREE.MeshStandardMaterial({ 
    color: 0xff6600, 
    emissive: 0xff6600, 
    emissiveIntensity: 0.8, 
    transparent: true, 
    opacity: 0.9 
});
const runeMaterialGreen = new THREE.MeshStandardMaterial({ 
    color: 0x00ff88, 
    emissive: 0x00ff88, 
    emissiveIntensity: 0.8, 
    transparent: true, 
    opacity: 0.9 
});

// --- TRACK ---
const trackGeometry = new THREE.PlaneGeometry(30, 1000);
const track = new THREE.Mesh(trackGeometry, trackMaterial);
track.rotation.x = -Math.PI / 2;
track.receiveShadow = true;
scene.add(track);

// Cracks (просто геометрия, мох будет отдельным мешем для emissive)
const crackGeo = new THREE.PlaneGeometry(0.2, 1000);
const crack1 = new THREE.Mesh(crackGeo, mossMaterial);
const crack2 = new THREE.Mesh(crackGeo, mossMaterial);
crack1.position.x = -state.laneOffset;
crack2.position.x = state.laneOffset;
crack1.rotation.x = -Math.PI / 2;
crack2.rotation.x = -Math.PI / 2;
scene.add(crack1, crack2);

// --- ENVIRONMENT (Procedural) ---
function spawnEnvironmentChunk(zPos) {
    const chunkSize = 50;
    const count = Math.floor(Math.random() * 4) + 3;
    for (let i = 0; i < count; i++) {
        const isColumn = Math.random() > 0.4;
        const width = isColumn ? 2 : (Math.random() * 8 + 4);
        const depth = isColumn ? 2 : (Math.random() * 8 + 4);
        const height = Math.random() * 20 + 5;

Копировать
    const geo = new THREE.BoxGeometry(width, height, depth);
    const mat = new THREE.MeshStandardMaterial({ 
        color: 0x5a4f3f, 
        roughness: 0.8 
    });
    const building = new THREE.Mesh(geo, mat);
    
    const side = Math.random() > 0.5 ? 1 : -1;
    const x = side * (state.laneOffset + Math.random() * 15 + 5);
    building.position.set(x, height / 2, zPos + (Math.random() - 0.5) * chunkSize);
    building.rotation.y = Math.random() * Math.PI * 2;
    building.castShadow = true;
    building.receiveShadow = true;
    scene.add(building);

    // Руны
    if (Math.random() > 0.5) {
        const runeMat = Math.random() > 0.5 ? runeMaterialGreen : runeMaterialOrange;
        const runeSize = Math.random() * 2 + 1;
        const runeGeo = new THREE.PlaneGeometry(runeSize, runeSize * 2);
        const rune = new THREE.Mesh(runeGeo, runeMat);
        const runeY = height - 2;
        const runeX = Math.random() * (width - 2) - (width / 2 - 1);
        const runeZ = Math.random() * (depth - 2) - (depth / 2 - 1);
        rune.position.set(runeX, runeY, runeZ);
        rune.lookAt(0, runeY, -100); // Смотрим в сторону камеры
        building.add(rune);
    }

    // Лианы (линии)
    if (Math.random() > 0.3) {
        const vineCount = Math.floor(Math.random() * 3) + 1;
        for (let v = 0; v < vineCount; v++) {
            const vinePoints = [];
            const startY = height + (Math.random() - 0.5) * 5;
            const startX = building.position.x + (Math.random() - 0.5) * width;
            const startZ = building.position.z + (Math.random() - 0.5) * depth;
            vinePoints.push(new THREE.Vector3(startX, startY, startZ));
            for (let p = 0; p < 3; p++) {
                vinePoints.push(new THREE.Vector3(
                    startX + (Math.random() - 0.5) * 10,
                    startY - (p + 1) * (Math.random() * 3 + 2),
                    startZ + (Math.random() - 0.5) * 10
                ));
            }
            const vineCurve = new THREE.CatmullRomCurve3(vinePoints);
            const vineGeo = new THREE.TubeGeometry(vineCurve, 6, 0.15, 4, false);
            const vine = new THREE.Mesh(vineGeo, new THREE.MeshStandardMaterial({ 
                color: 0x225522, 
                roughness: 0.9 
            }));
            vine.castShadow = true;
            scene.add(vine);
        }
    }
}

// Факелы
const torchCount = Math.floor(Math.random() * 3) + 1;
for (let t = 0; t < torchCount; t++) {
    const torchX = (Math.random() - 0.5) * 40;
    const torchZ = zPos + (Math.random() - 0.5) * chunkSize;
    
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 3, 8), new THREE.MeshStandardMaterial({ color: 0x8b5a2b }));
    pole.position.set(torchX, 1.5, torchZ);
    pole.castShadow = true;
    scene.add(pole);

    const fireGeo = new THREE.ConeGeometry(0.5, 1.5, 8);
    const fire = new THREE.Mesh(fireGeo, new THREE.MeshBasicMaterial({ color: 0xffaa33 }));
    fire.position.set(torchX, 3.2, torchZ);
    fire.rotation.x = Math.PI;
    scene.add(fire);

    const fireLight = new THREE.PointLight(0xffaa33, 2, 5);
    fireLight.position.set(torchX, 3.2, torchZ);
    scene.add(fireLight);
}


}

// Генерация начального куска
for(let i = 0; i < 2000; i += 50) {
    spawnEnvironmentChunk(-i);
}

// --- PLAYER ---
let player;
let mixer;
let playerBaseY = 0;
let clock = new THREE.Clock();

const fallbackCapsule = new THREE.Mesh(
    new THREE.CapsuleGeometry(0.4, 1.8, 4, 8),
    new THREE.MeshStandardMaterial({ color: 0x3333ff })
);
fallbackCapsule.position.y = 1.0;
fallbackCapsule.castShadow = true;

gltfLoader.load('player_game.glb', (gltf) => {
    player = gltf.scene;
    player.traverse((child) => {
        if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;
        }
    });

Копировать
const box = new THREE.Box3().setFromObject(player);
playerBaseY = -box.min.y;
state.playerBaseY = playerBaseY;
player.position.y = playerBaseY;

// Разворот лицом вперед (-Z)
player.rotation.y = Math.PI;

scene.add(player);

mixer = new THREE.AnimationMixer(player);
const clips = gltf.animations;
const runClip = clips.find(c => c.name.toLowerCase().includes('run') || c.name.toLowerCase().includes('walk'));
if (runClip) {
    mixer.clipAction(runClip).play();
}


}, undefined, (err) => {
    console.error('GLTF Load Error, using fallback capsule:', err);
    player = fallbackCapsule;
    playerBaseY = 1.0;
    state.playerBaseY = playerBaseY;
    player.position.y = playerBaseY;
    player.rotation.y = Math.PI;
    scene.add(player);
});

// --- COINS ---
const coins = [];
function spawnCoin(zPos) {
    const coinGeo = new THREE.CylinderGeometry(0.8, 0.8, 0.2, 32);
    const coin = new THREE.Mesh(coinGeo, goldMaterial);
    const side = Math.floor(Math.random() * 3) - 1;
    coin.position.set(side * state.laneOffset, 1.2, zPos);
    coin.rotation.x = Math.PI / 2;
    coin.castShadow = true;
    scene.add(coin);
    coins.push(coin);
}

// --- OBSTACLES ---
const obstacles = [];
function spawnObstacle(zPos) {
    const type = Math.random() > 0.5 ? 'high' : 'low';
    const width = 4;
    const depth = 4;
    const height = type === 'high' ? (Math.random() * 4 + 3) : 1.2;

Копировать
const geo = new THREE.BoxGeometry(width, height, depth);
const mat = new THREE.MeshStandardMaterial({ 
    color: 0x5a4f3f, 
    roughness: 0.9 
});
const obs = new THREE.Mesh(geo, mat);

const lane = Math.floor(Math.random() * 3) - 1;
obs.position.set(lane * state.laneOffset, height / 2, zPos);
obs.castShadow = true;
obs.receiveShadow = true;
scene.add(obs);
obstacles.push({ mesh: obs, type: type });


}

// --- PARTICLES ---
const particles = [];
function explode(x, y, z) {
    for (let i = 0; i < 40; i++) {
        const geo = new THREE.BoxGeometry(0.1, 0.1, 0.1);
        const mat = new THREE.MeshStandardMaterial({ color: 0x8b7d6b });
        const p = new THREE.Mesh(geo, mat);
        p.position.set(x, y, z);
        const vel = new THREE.Vector3(
            (Math.random() - 0.5) * 0.5,
            Math.random() * 0.3 + 0.1,
            (Math.random() - 0.5) * 0.5
        );
        particles.push({ mesh: p, velocity: vel });
        scene.add(p);
    }
}

// --- GAME LOOP ---
const uiScore = document.getElementById('score');
const gameOverScreen = document.getElementById('gameOver');
const finalScoreText = document.getElementById('finalScore');

function animate() {
    requestAnimationFrame(animate);
    const delta = clock.getDelta();

Копировать
if (state.gameOver) {
    renderer.render(scene, camera);
    return;
}

if (mixer) mixer.update(delta);

// Track scroll
track.position.z += state.speed;
crack1.position.z += state.speed;
crack2.position.z += state.speed;
if (track.position.z > 500) track.position.z = 0;
if (crack1.position.z > 500) crack1.position.z = 0;
if (crack2.position.z > 500) crack2.position.z = 0;

// Environment recycle
state.lastSpawnZ += state.speed;
if (state.lastSpawnZ > state.spawnRate) {
    state.lastSpawnZ = 0;
    spawnEnvironmentChunk(-1500);
}

// Coins
state.lastCoinSpawn += state.speed;
if (state.lastCoinSpawn > state.coinRate) {
    state.lastCoinSpawn = 0;
    spawnCoin(-50);
}

// Obstacles
if (Math.random() < 0.02) {
    spawnObstacle(-50);
}

// Player lane logic
const laneDelta = (state.targetLane - state.lane) * 0.05;
state.lane += laneDelta;
if (player) {
    player.position.x = state.lane * state.laneOffset;
    player.position.z = -5;
    player.rotation.z = -laneDelta * 10; // Наклон при перестроении
}

// Jump physics
if (state.isJumping) {
    state.jumpVelocity -= state.gravity;
    if (player) player.position.y += state.jumpVelocity;
    if (player.position.y <= state.playerBaseY) {
        player.position.y = state.playerBaseY;
        state.isJumping = false;
        state.jumpVelocity = 0;
        player.rotation.z = 0;
    }
}

// Coins collision
for (let i = coins.length - 1; i >= 0; i--) {
    const coin = coins[i];
    coin.rotation.y += 0.1;
    if (player && coin.position.distanceTo(player.position) < 1.5) {
        state.score += 10;
        uiScore.innerText = 'Дистанция: ' + state.score;
        scene.remove(coin);
        coins.splice(i, 1);
    } else if (coin.position.z > 10) {
        scene.remove(coin);
        coins.splice(i, 1);
    }
}

// Obstacles collision
for (let i = obstacles.length - 1; i >= 0; i--) {
    const obs = obstacles[i];
    if (player && obs.mesh.position.distanceTo(player.position) < 2.0) {
        if ((obs.type === 'low' && !state.isJumping) || (obs.type === 'high' && state.isJumping)) {
            state.gameOver = true;
            gameOverScreen.style.display = 'block';
            finalScoreText.innerText = 'Итоговый счет: ' + state.score;
            // Останавливаем всё
            state.speed = 0;
            if (mixer) mixer.timeScale = 0;
        }
        explode(obs.mesh.position.x, obs.mesh.position.y, obs.mesh.position.z);
        scene.remove(obs.mesh);
        obstacles.splice(i, 1);
    } else if (obs.mesh.position.z > 10) {
        scene.remove(obs.mesh);
        obstacles.splice(i, 1);
    }
}

// Particles
for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.mesh.position.add(p.velocity);
    p.velocity.y -= state.gravity * 0.5;
    if (p.mesh.position.y < 0) {
        scene.remove(p.mesh);
        particles.splice(i, 1);
    }
}

camera.position.x = player.position.x;
camera.lookAt(player.position.x, 2, 0);

renderer.render(scene, camera);


}

// --- INPUT ---
window.addEventListener('keydown', (e) => {
    if (state.gameOver) return;
    if (e.code === 'ArrowLeft' && state.lane > -1) state.targetLane = state.lane - 1;
    if (e.code === 'ArrowRight' && state.lane < 1) state.targetLane = state.lane + 1;
    if (e.code === 'Space' && !state.isJumping) {
        state.isJumping = true;
        state.jumpVelocity = 0.25;
    }
});

// Touch controls (optional)
let touchStartX = 0;
window.addEventListener('touchstart', (e) => {
    if (state.gameOver) return;
    touchStartX = e.touches[0].clientX;
});
window.addEventListener('touchend', (e) => {
    if (state.gameOver) return;
    const diff = e.changedTouches[0].clientX - touchStartX;
    if (diff < -50 && state.lane > -1) state.targetLane = state.lane - 1;
    if (diff > 50 && state.lane < 1) state.targetLane = state.lane + 1;
});

// --- UI ---
document.getElementById('restartBtn').addEventListener('click', () => {
    location.reload();
});

// --- RESIZE ---
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>

</body>
</html>
